<script>
/* Minimal async test runner. Results are written into the DOM so headless Chrome's
 * --dump-dom can read them; see run_tests.sh. */
const TESTS = [];
function test(name, fn) { TESTS.push({ name, fn }); }
function assert(cond, msg) { if (!cond) throw new Error(msg || 'assertion failed'); }
function eq(a, b, msg) { if (a !== b) throw new Error((msg || '') + ' expected ' + JSON.stringify(b) + ' got ' + JSON.stringify(a)); }
function approx(a, b, tol, msg) {
  const ok = Number.isFinite(a) && Number.isFinite(b) && Math.abs(a - b) <= tol * Math.max(1, Math.abs(b));
  if (!ok) throw new Error((msg || '') + ' expected ≈' + b + ' got ' + a + ' (tol ' + tol + ')');
}
function absApprox(a, b, tol, msg) {
  if (!(Math.abs(a - b) <= tol)) throw new Error((msg || '') + ' expected ' + b + ' ± ' + tol + ', got ' + a);
}
async function run() {
  const log = document.getElementById('log');
  let pass = 0, fail = 0, skip = 0;
  const lines = [];
  for (const t of TESTS) {
    const t0 = performance.now();
    try {
      const r = await t.fn();
      if (r === 'SKIP') { skip++; lines.push('SKIP ' + t.name); continue; }
      pass++; lines.push('PASS ' + t.name + (typeof r === 'string' && r.startsWith('INFO') ? '\n     ' + r : ''));
    }
    catch (e) { fail++; lines.push('FAIL ' + t.name + '\n     ' + (e && e.stack ? e.stack.split('\n').slice(0, 3).join('\n     ') : e)); }
  }
  log.textContent = lines.join('\n');
  document.getElementById('summary').textContent = 'DONE pass=' + pass + ' fail=' + fail + ' skip=' + skip;
  document.getElementById('summary').className = fail ? 'fail' : 'pass';
}
</script>
